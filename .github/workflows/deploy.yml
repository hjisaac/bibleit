name: Deploy App to Cloudflare Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      deployments: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 8

      - name: Install dependencies
        working-directory: app
        run: pnpm install --frozen-lockfile

      - name: Build app
        working-directory: app
        env:
          VITE_CLOUDFLARE_R2_URL: ${{ vars.VITE_CLOUDFLARE_R2_URL }}
          VITE_FEEDBACK_EMAIL: ${{ vars.VITE_FEEDBACK_EMAIL }}
          VITE_BACKEND_API_URL: ${{ vars.VITE_BACKEND_API_URL }}
        run: |
          export VITE_CLOUDFLARE_R2_URL=$(echo "$VITE_CLOUDFLARE_R2_URL" | tr -d '[:space:]')
          export VITE_FEEDBACK_EMAIL=$(echo "$VITE_FEEDBACK_EMAIL" | tr -d '[:space:]')
          export VITE_BACKEND_API_URL=$(echo "$VITE_BACKEND_API_URL" | tr -d '[:space:]')
          if [ -z "$VITE_CLOUDFLARE_R2_URL" ]; then
            echo "Error: vars.VITE_CLOUDFLARE_R2_URL is missing or empty" && exit 1
          fi
          if [ -z "$VITE_FEEDBACK_EMAIL" ]; then
            echo "Error: vars.VITE_FEEDBACK_EMAIL is missing or empty" && exit 1
          fi
          if [ -z "$VITE_BACKEND_API_URL" ]; then
            echo "Error: vars.VITE_BACKEND_API_URL is missing or empty" && exit 1
          fi
          pnpm build

      - name: Deploy to Cloudflare Pages
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          npx wrangler pages project create bibleit --production-branch main || true
          npx wrangler pages deploy app/dist --project-name=bibleit
