name = "bibleit-proxy"
main = "src/index.ts"
compatibility_date = "2025-04-01"

[observability]
enabled = true

[vars]
# Comma-separated "name=url" or plain URLs. Override in Cloudflare Dashboard for production.
UPSTREAMS = "render=https://bibleit-api.onrender.com,serv00=https://bibleit.serv00.net"
UPSTREAM_TIMEOUT_MS = "3500"
STREAM_TIMEOUT_MS = "12000"
FAILURE_THRESHOLD = "2"
COOLDOWN_MS = "30000"
