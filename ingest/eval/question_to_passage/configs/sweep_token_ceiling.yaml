# Token ceiling retrieval evaluation sweep
log_console_level: INFO
log_file_level: INFO

k:
  - 1
  - 3
  - 5
  - 10

chunk:
  strategy: "token_window"
  ceiling:
    - 256
    - 512
  overlap:
    - 0
    - 1
  include_overlap_heading:
    - true
    - false
  render_strategy:
    - "heading_and_text"
    - "book_and_heading"

eval_data_path: ingest/data/eval/question_to_passage.json
web_path: ingest/data/translations/web/en/web.json
embedding_model: "nomic-ai/nomic-embed-text-v1.5"
threads: 4
track: true
