# Evaluation of int8 quantized corpus across top-k
k:
  - 1
  - 3
  - 5
  - 10

strategy: "token_window"
ceiling: 512
overlap: 0
floor: 5
headroom_margin: 25
include_overlap_heading: true
render_strategy: "book_and_heading"

eval_data_path: ingest/data/eval/question_to_passage.json
web_path: ingest/data/translations/web/en/web.json
embedding_model: "nomic-ai/nomic-embed-text-v1.5"
quantized: true
threads: 4
track: false
