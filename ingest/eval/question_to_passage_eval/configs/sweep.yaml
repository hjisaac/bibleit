# CWD-relative: run crucible execute from ingest/.
log_dir: eval/question_to_passage_eval/outputs
log_console_level: INFO
log_file_level: INFO

k:
  - 1
  - 2
  - 3
  - 4
  - 5

floor: 5
ceiling: 30
overlap: 0

render_strategy:
  - heading_and_text
  - text_only
  - book_and_heading
  - address_and_heading

# REPO-relative, not CWD-relative (see job.py).
eval_data_path: ingest/data/eval/question_to_passage.json
web_path: ingest/data/translations/web/en/web.json
embedding_model: nomic-ai/nomic-embed-text-v1.5
threads: 2
