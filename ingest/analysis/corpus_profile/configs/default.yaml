# Context limit for truncation / overflow checks
token_limit: 512

# Embedding model tokenizer to profile (can be a list in sweeps)
tokenizer_model: "nomic-ai/nomic-embed-text-v1.5"

# Optional run tag
tag: null

# Paths relative to REPO
web_path: "ingest/data/translations/web/en/web.json"
bsb_dir: "ingest/data/translations/bsb/en"

# CWD-relative: run crucible execute from ingest/
log_dir: analysis/corpus_profile/outputs
