[project]
name = "ingest"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "codetiming>=1.4.0",
    # eval/jobs/question_to_passage_eval actually calls into crucible
    # (AbstractJob, WBTracker) to run -- not a dev-only tool, the same
    # way ranx isn't: eval's own code needs it to do its job.
    "crucible[wandb]",
    "fastembed>=0.8.0",
    "ranx>=0.3.21",
    "usearch>=2.26.2",
]

[tool.uv.sources]
# crucible (originally the run-crucible project) is vendored directly at
# ingest/eval_engine as first-party source, not an external dependency --
# no separate repo, no submodule. Editable so an edit there is picked up
# without reinstalling.
crucible = { path = "eval_engine", editable = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
# the project is named "ingest" but the actual importable packages are
# "bibleit_ingest" (the ingest pipeline) and "eval" (retrieval evaluation,
# a separate concern that consumes what ingest produces) — hatchling can't
# infer either from the project name, so both are told explicitly. eval's
# source now lives nested at eval_engine/eval (alongside the crucible-
# derived job engine it depends on), but the import name is still eval --
# hatchling takes it from the last path segment.
packages = ["bibleit_ingest", "eval_engine/eval"]
