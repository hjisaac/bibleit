[project]
name = "ingest"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "codetiming>=1.4.0",
    # eval/jobs/question_to_passage_eval actually calls into crucible
    # (AbstractJob, WBTracker) to run -- not a dev-only tool, the same
    # way ranx isn't: eval's own code needs it to do its job.
    "crucible[wandb]",
    "datalens[viz]",
    "fastembed>=0.8.0",
    "joblib>=1.3.0",
    "matplotlib>=3.8.0",
    "ranx>=0.3.21",
    "snakemd>=2.0.0",
    "tqdm>=4.66.0",
    "usearch>=2.26.2",
]

[tool.uv.sources]
crucible = { path = "crucible", editable = true }
datalens = { git = "https://github.com/hjisaac/datalens.git", branch = "feat/mcp-server" }

[dependency-groups]
dev = [
    "pytest>=8.0.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["bibleit_ingest", "rag_core", "eval", "analysis"]
