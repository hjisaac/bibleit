[project]
name = "ingest"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "codetiming>=1.4.0",
    "fastembed>=0.8.0",
    "python-box>=7.4.1",
    "ranx>=0.3.21",
    "usearch>=2.26.2",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
# the project is named "ingest" but the actual importable packages are
# "bibleit_ingest" (the ingest pipeline) and "eval" (retrieval evaluation,
# a separate concern that consumes what ingest produces) — hatchling can't
# infer either from the project name, so both are told explicitly.
packages = ["bibleit_ingest", "eval"]
