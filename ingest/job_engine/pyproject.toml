[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "crucible"
version = "0.1.0"
description = "From paper or idea to runnable experiment with minimal friction."
requires-python = ">=3.11"
dependencies = [
    # The job lifecycle, config loading, and CLI itself.
    "dotenv>=0.9.9",
    "hydra-core>=1.3.2",
    "numpy>=2.4.4",
    "omegaconf>=2.3.0",
    "rich>=14.3.3",
    "typer>=0.24.1",
]

[project.optional-dependencies]
wandb = ["wandb>=0.25.0"]

[project.scripts]
crucible = "crucible.interface.cli:main"

[tool.uv]
package = true

[tool.setuptools.packages.find]
include = ["crucible*", "jobs*"]

[tool.setuptools.package-data]
"interface.cli" = ["templates/*.tpl"]
