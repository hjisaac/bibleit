[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "crucible"
version = "0.1.0"
description = "From paper or idea to runnable experiment with minimal friction."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    # The job lifecycle, config loading, and CLI itself -- what every
    # consumer needs regardless of whether they ever train a model.
    "dotenv>=0.9.9",
    "hydra-core>=1.3.2",
    "numpy>=2.4.4",
    "omegaconf>=2.3.0",
    "python-decouple>=3.8",
    "rich>=14.3.3",
    "typer>=0.24.1",
]

[project.optional-dependencies]
# jobs/mlp, jobs/simple_mlp_on_mnist, and crucible/plugins/ml/* need
# this; the core lifecycle (AbstractJob, config, logging, CLI) doesn't.
# Split out so a consumer using only the job/tracker machinery (see
# extras below) isn't forced to install the full training stack.
ml = [
    "accelerate>=1.13.0",
    "datasets>=4.8.4",
    "deepspeed>=0.18.9",
    "diffusers>=0.37.1",
    "lightning>=2.6.1",
    "matplotlib>=3.10.8",
    "pandas>=3.0.2",
    "scikit-learn>=1.8.0",
    "timm>=1.0.26",
    "tokenizers>=0.22.2",
    "torch==2.10.0",
    "torchaudio==2.10.0",
    "torchmetrics>=1.9.0",
    "torchvision==0.25.0",
    "transformers>=5.6.1",
]
# Each tracker is its own extra: a consumer wanting WBTracker shouldn't
# need tensorboard installed, or vice versa.
wandb = ["wandb>=0.25.0"]
tensorboard = ["tensorboard>=2.20.0"]
# Interactive dev tool, not something a job's runtime ever needs.
notebook = ["jupyterlab>=4.5.6"]

[project.scripts]
crucible = "crucible.interface.cli:main"

[dependency-groups]
dev = [
    "pytest>=8.3.0",
]

[tool.uv]
package = true

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cpu" }
torchvision = { index = "pytorch-cpu" }
torchaudio = { index = "pytorch-cpu" }

[tool.setuptools.packages.find]
include = ["crucible*", "jobs*"]

[tool.setuptools.package-data]
"interface.cli" = ["templates/*.tpl"]
